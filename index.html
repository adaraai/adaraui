    <meta name="description" content="ADARA AI Lab builds the data, models, and tools that make AI fluent in African languages, culture, commerce, and everyday life." />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <link rel="preload" href="/assets/hero-bg.jpg" as="image" type="image/jpeg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      (function () {
        try {
          var key = "adara-ui-theme";
          var theme = localStorage.getItem(key);
          var isDark =
            theme === "dark" ||
            ((theme === "system" || theme === null) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
